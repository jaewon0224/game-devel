<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>test — 캐릭터 이동</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #858398; color: #ecedf6; font-family: "Malgun Gothic", sans-serif; }
    main { position: relative; width: 100%; height: 100vh; height: 100dvh; }
    header { position: absolute; z-index: 1; inset: 20px 20px auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; pointer-events: none; }
    .title-panel { padding: 12px 16px; border: 1px solid #ffffff20; border-radius: 8px; background: #171823d9; }
    h1 { margin: 5px 0 0; font-size: 22px; }
    .tag { color: #b3a0ff; font-size: 11px; letter-spacing: 2px; }
    p { margin: 0; color: #e3dfed; font-size: 13px; line-height: 1.8; }
    canvas { display: block; width: 100%; height: 100%; background: #858398; touch-action: none; }
    canvas:focus-visible { outline: 3px solid #b3a0ff; outline-offset: -3px; }
    button:focus-visible { outline: 3px solid #b3a0ff; outline-offset: 4px; }
    button { padding: 10px 16px; border: 1px solid #686184; border-radius: 6px; background: #302c47ed; color: #fff; font: inherit; cursor: pointer; pointer-events: auto; }
    footer { position: absolute; z-index: 1; inset: auto 20px 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; pointer-events: none; }
    footer p { padding: 8px 12px; border: 1px solid #ffffff20; border-radius: 6px; background: #171823d9; }
    #status { color: #d1bf92; }
    @media (max-width: 540px) { header { inset: 12px 12px auto; gap: 8px; } footer { inset: auto 12px 12px; } .tag { font-size: 9px; letter-spacing: 1px; } h1 { font-size: 18px; } button { padding: 9px 11px; font-size: 12px; } footer p { font-size: 11px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="title-panel"><span class="tag">CHARACTER / MOVEMENT TEST</span><h1>test · 궁수</h1></div>
      <button id="restart" type="button">위치 초기화</button>
    </header>
    <canvas id="game" width="960" height="576" tabindex="0" aria-label="궁수 이동 연습장. WASD 또는 방향키로 이동하고 Shift를 누르면 달립니다.">이 게임은 Canvas를 지원하는 브라우저에서 실행할 수 있습니다.</canvas>
    <footer><p>이동 WASD / 방향키 · 달리기 Shift + 이동</p><p id="status" role="status">캐릭터 불러오는 중…</p></footer>
  </main>
  <script>
    'use strict';

    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const statusLabel = document.querySelector('#status');
    const keys = new Set();
    // 화면 크기는 CSS 픽셀, 캔버스 해상도는 기기의 픽셀 밀도에 맞춥니다.
    const view = { width: 960, height: 576, dpr: 1 };
    // 캐릭터와 카메라는 화면 크기에 관계없는 월드 좌표를 사용합니다.
    const player = { x: 480, y: 330, facing: 1, phase: 0, moving: false, running: false };
    const camera = { x: 0, y: 0 };
    // 바닥 석판의 두 대각선 방향에 맞춘 성벽. 두 군데에 통로를 둡니다.
    const floorSlope = 0.72;
    const walls = [
      { x: 80, y: 338, length: 160, depth: 28, height: 70, slope: -floorSlope },
      { x: 340, y: 150.8, length: 140, depth: 28, height: 70, slope: -floorSlope },
      { x: 480, y: 50, length: 400, depth: 28, height: 70, slope: floorSlope },
      { x: 80, y: 338, length: 400, depth: 28, height: 70, slope: floorSlope },
      { x: 480, y: 626, length: 170, depth: 28, height: 70, slope: -floorSlope },
      { x: 750, y: 431.6, length: 130, depth: 28, height: 70, slope: -floorSlope }
    ];
    const wallSections = walls.flatMap(wall => {
      const sections = [];
      for (let start = 0; start < wall.length; start += 44) {
        const end = Math.min(start + 44, wall.length);
        const corners = wallCorners(wall, start, end);
        sections.push({ wall, start, end, depth: Math.max(...corners.map(point => point.y)) });
      }
      return sections;
    });
    const sprites = {};
    let ready = false;
    let loadFailed = false;
    let lastTime = null;
    let lastStatus = '';

    // background.png에서 참고한 바닥만 재현한 이미지입니다.
    const floorImage = new Image();
    const floorTileWidth = 896; // 전체 화면으로 넓히기 전 바닥과 같은 크기.
    let floorPattern = null;
    let floorReady = false;
    let floorFailed = false;
    floorImage.onload = () => {
      try {
        const tileWidth = floorTileWidth;
        const tileHeight = Math.round(tileWidth * floorImage.naturalHeight / floorImage.naturalWidth);
        const overlap = 16;
        const patch = document.createElement('canvas');
        patch.width = tileWidth;
        patch.height = tileHeight;
        const patchContext = patch.getContext('2d');
        patchContext.drawImage(floorImage, 0, 0, tileWidth, tileHeight);
        // 방향을 뒤집지 않고 양쪽 가장자리만 겹쳐 이어줍니다.
        // 모서리에서도 가로·세로의 가중치 합이 1이 되어 빈틈이 생기지 않습니다.
        const fadeX = patchContext.createLinearGradient(0, 0, tileWidth, 0);
        fadeX.addColorStop(0, 'transparent');
        fadeX.addColorStop(overlap / tileWidth, '#fff');
        fadeX.addColorStop(1 - overlap / tileWidth, '#fff');
        fadeX.addColorStop(1, 'transparent');
        const fadeY = patchContext.createLinearGradient(0, 0, 0, tileHeight);
        fadeY.addColorStop(0, 'transparent');
        fadeY.addColorStop(overlap / tileHeight, '#fff');
        fadeY.addColorStop(1 - overlap / tileHeight, '#fff');
        fadeY.addColorStop(1, 'transparent');
        patchContext.globalCompositeOperation = 'destination-in';
        patchContext.fillStyle = fadeX;
        patchContext.fillRect(0, 0, tileWidth, tileHeight);
        patchContext.fillStyle = fadeY;
        patchContext.fillRect(0, 0, tileWidth, tileHeight);
        const tile = document.createElement('canvas');
        tile.width = tileWidth - overlap;
        tile.height = tileHeight - overlap;
        const tileContext = tile.getContext('2d');
        tileContext.globalCompositeOperation = 'lighter';
        for (let y = -1; y <= 0; y++) {
          for (let x = -1; x <= 0; x++) {
            tileContext.drawImage(patch, x * tile.width, y * tile.height);
          }
        }
        floorPattern = ctx.createPattern(tile, 'repeat');
        floorReady = Boolean(floorPattern);
        floorFailed = !floorReady;
      } catch (error) {
        floorFailed = true;
        console.error('바닥 준비 실패', error);
      }
    };
    floorImage.onerror = () => { floorFailed = true; };
    floorImage.src = 'assets/background-floor.png';

    // assets/maincharacter.png의 포즈 영역. 글자가 있는 줄은 제외합니다.
    const poses = {
      idle: { x: 298, y: 232, w: 82, h: 103, footX: 39, footY: 74 },
      walk: { x: 1128, y: 400, w: 97, h: 110, footX: 49, footY: 86 },
      run:  { x: 851, y: 232, w: 97, h: 103, footX: 49, footY: 76 }
    };

    function prepareSprite(image, pose) {
      const sprite = document.createElement('canvas');
      sprite.width = pose.w;
      sprite.height = pose.h;
      const context = sprite.getContext('2d');
      context.drawImage(image, pose.x, pose.y, pose.w, pose.h, 0, 0, pose.w, pose.h);
      const pixels = context.getImageData(0, 0, pose.w, pose.h);
      // 시트의 청록색 바탕과 바닥 그림자를 투명하게 만들어 맵에 합성합니다.
      for (let i = 0; i < pixels.data.length; i += 4) {
        const r = pixels.data[i], g = pixels.data[i + 1], b = pixels.data[i + 2];
        if (g - r > 12 && b - r > 20) pixels.data[i + 3] = 0;
      }
      context.putImageData(pixels, 0, 0);
      return sprite;
    }

    const characterImage = new Image();
    characterImage.onload = () => {
      try {
        for (const [name, pose] of Object.entries(poses)) sprites[name] = prepareSprite(characterImage, pose);
        ready = true;
      } catch (error) {
        loadFailed = true;
        console.error('캐릭터 준비 실패', error);
      }
    };
    characterImage.onerror = () => { loadFailed = true; };
    // 원본 PNG를 내장하여 파일을 직접 열어도 배경 분리와 렌더링이 가능합니다.

    function updateCamera(dt, snap = false) {
      // 화면 중앙에서는 자유롭게 이동하고, 가장자리에 가까워지면 스크롤합니다.
      const marginX = Math.min(240, view.width * 0.22);
      const marginTop = Math.min(210, view.height * 0.26);
      const marginBottom = Math.min(160, view.height * 0.22);
      const screenX = player.x - camera.x;
      const screenY = player.y - camera.y;
      let targetX = camera.x, targetY = camera.y;
      if (screenX < marginX) targetX = player.x - marginX;
      if (screenX > view.width - marginX) targetX = player.x - (view.width - marginX);
      if (screenY < marginTop) targetY = player.y - marginTop;
      if (screenY > view.height - marginBottom) targetY = player.y - (view.height - marginBottom);
      const follow = snap ? 1 : 1 - Math.exp(-12 * dt);
      camera.x += (targetX - camera.x) * follow;
      camera.y += (targetY - camera.y) * follow;
    }

    function resize() {
      const oldWidth = view.width, oldHeight = view.height;
      view.width = Math.max(1, canvas.clientWidth);
      view.height = Math.max(1, canvas.clientHeight);
      view.dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(view.width * view.dpr);
      canvas.height = Math.round(view.height * view.dpr);
      // 창 크기를 바꿔도 캐릭터의 월드 위치와 바닥 배율은 바뀌지 않습니다.
      camera.x += (oldWidth - view.width) / 2;
      camera.y += (oldHeight - view.height) / 2;
      updateCamera(0, true);
      lastTime = null;
    }
    window.addEventListener('resize', resize);

    function reset() {
      Object.assign(player, { x: 480, y: 330, facing: 1, phase: 0, moving: false, running: false });
      camera.x = player.x - view.width / 2;
      camera.y = player.y - (view.height / 2 + 42);
      updateCamera(0, true);
      keys.clear();
      lastTime = null;
    }

    const movementKeys = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowLeft', 'ArrowDown', 'ArrowRight'];
    const inputKeys = [...movementKeys, 'ShiftLeft', 'ShiftRight'];
    window.addEventListener('keydown', event => {
      if (!inputKeys.includes(event.code) || event.ctrlKey || event.metaKey || event.altKey || event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      event.preventDefault();
      keys.add(event.code);
    });
    window.addEventListener('keyup', event => keys.delete(event.code));
    window.addEventListener('blur', () => keys.clear());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) keys.clear();
      lastTime = null;
    });
    canvas.addEventListener('pointerdown', () => canvas.focus());
    document.querySelector('#restart').addEventListener('click', () => { reset(); canvas.focus(); });

    function wallPoint(wall, u, v, z = 0) {
      return { x: wall.x + u + v, y: wall.y + wall.slope * (u - v) - z };
    }

    function wallCorners(wall, start = 0, end = wall.length) {
      return [wallPoint(wall, start, 0), wallPoint(wall, end, 0), wallPoint(wall, end, wall.depth), wallPoint(wall, start, wall.depth)];
    }

    function resolveWallCollision(wall) {
      // 세로 좌표를 늘려 발밑의 타원을 반지름 12인 원으로 계산합니다.
      const radius = 12, yScale = 1.5;
      const px = player.x, py = player.y * yScale;
      const points = wallCorners(wall).map(point => ({ x: point.x, y: point.y * yScale }));
      const dx = player.x - wall.x, dy = (player.y - wall.y) / wall.slope;
      const u = (dx + dy) / 2, v = (dx - dy) / 2;
      const inside = u >= 0 && u <= wall.length && v >= 0 && v <= wall.depth;
      let nearest = null;
      for (let i = 0; i < points.length; i++) {
        const a = points[i], b = points[(i + 1) % points.length];
        const ex = b.x - a.x, ey = b.y - a.y;
        const t = Math.max(0, Math.min(1, ((px - a.x) * ex + (py - a.y) * ey) / (ex * ex + ey * ey)));
        const qx = a.x + ex * t, qy = a.y + ey * t;
        const distance = Math.hypot(px - qx, py - qy);
        if (!nearest || distance < nearest.distance) nearest = { x: qx, y: qy, distance, ex, ey };
      }
      if (!inside && nearest.distance >= radius) return;
      let nx, ny;
      if (nearest.distance > 0.00001) {
        const direction = inside ? -1 : 1;
        nx = (px - nearest.x) / nearest.distance * direction;
        ny = (py - nearest.y) / nearest.distance * direction;
      } else {
        nx = -nearest.ey; ny = nearest.ex;
        const centerX = points.reduce((sum, p) => sum + p.x, 0) / 4;
        const centerY = points.reduce((sum, p) => sum + p.y, 0) / 4;
        if (nx * (px - centerX) + ny * (py - centerY) < 0) { nx = -nx; ny = -ny; }
        const normalLength = Math.hypot(nx, ny);
        nx /= normalLength; ny /= normalLength;
      }
      const push = inside ? radius + nearest.distance + 0.001 : radius - nearest.distance + 0.001;
      player.x += nx * push;
      player.y += ny * push / yScale;
    }

    function movePlayer(dx, dy) {
      // 짧은 단계로 나눠 달릴 때도 벽을 통과하지 않고 대각선 벽을 따라 미끄러집니다.
      const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 4));
      for (let step = 0; step < steps; step++) {
        player.x += dx / steps;
        player.y += dy / steps;
        for (let pass = 0; pass < 3; pass++) {
          for (const wall of walls) resolveWallCollision(wall);
        }
      }
    }

    function update(dt) {
      if (!ready) return;
      const dx = Number(keys.has('KeyD') || keys.has('ArrowRight')) - Number(keys.has('KeyA') || keys.has('ArrowLeft'));
      const dy = Number(keys.has('KeyS') || keys.has('ArrowDown')) - Number(keys.has('KeyW') || keys.has('ArrowUp'));
      const length = Math.hypot(dx, dy);
      player.running = length > 0 && (keys.has('ShiftLeft') || keys.has('ShiftRight'));
      const speed = player.running ? 270 : 155;
      const oldX = player.x, oldY = player.y;
      if (length) {
        movePlayer(dx / length * speed * dt, dy / length * speed * dt);
        if (dx) player.facing = Math.sign(dx);
      }
      player.moving = Math.hypot(player.x - oldX, player.y - oldY) > 0.001;
      if (player.moving) player.phase += dt * (player.running ? 15 : 10);
      else { player.phase = 0; player.running = false; }
      updateCamera(dt);
    }

    function stoneFace(a, b, height, baseHeight, detail, shade, seed) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const length = Math.hypot(dx, dy);
      ctx.save();
      // 벽돌의 가로줄은 바닥 방향을 따르고, 벽의 높이는 수직으로 유지합니다.
      ctx.transform(dx / length, dy / length, 0, 1, a.x, a.y - baseHeight - height);
      ctx.fillStyle = shade;
      ctx.fillRect(0, 0, length, height);
      if (detail) {
        const colors = ['#777781', '#85838d', '#6d6e7b', '#91909a', '#7c7b87'];
        ctx.save();
        ctx.beginPath();
        ctx.rect(1, 2, length - 2, height - 4);
        ctx.clip();
        for (let row = 0; row < Math.ceil(height / 18); row++) {
          const offset = row % 2 ? -20 : 0;
          for (let col = 0; col < Math.ceil(length / 40) + 1; col++) {
            const bx = offset + col * 40, by = row * 18 + 2;
            ctx.fillStyle = colors[(row * 3 + col * 7 + seed) % colors.length];
            ctx.fillRect(bx + 1, by, 37, 15);
            ctx.fillStyle = '#c2bdca66';
            ctx.fillRect(bx + 2, by, 35, 2);
            ctx.fillStyle = '#42434f44';
            ctx.fillRect(bx + 2, by + 12, 35, 3);
            if ((row + col + seed) % 5 === 0) {
              ctx.fillStyle = '#535d50';
              ctx.fillRect(bx + 3, by + 13, 7, 2);
            }
          }
        }
        ctx.restore();
      } else {
        ctx.fillStyle = '#8f8d98';
        ctx.fillRect(2, 2, Math.max(0, length - 4), Math.max(0, height - 4));
      }
      ctx.fillStyle = '#c5c1cc';
      ctx.fillRect(0, 0, length, 2);
      ctx.fillStyle = '#43424e';
      ctx.fillRect(0, height - 3, length, 3);
      ctx.restore();
    }

    function stoneBlock(wall, u, v, length, depth, height, baseHeight = 0, detail = true, seed = 0) {
      const a = wallPoint(wall, u, v), b = wallPoint(wall, u + length, v);
      const c = wallPoint(wall, u + length, v + depth), d = wallPoint(wall, u, v + depth);
      if (wall.slope > 0) {
        stoneFace(b, c, height, baseHeight, detail, '#50515c', seed);
        stoneFace(a, b, height, baseHeight, detail, '#62626e', seed);
      } else {
        stoneFace(a, d, height, baseHeight, detail, '#50515c', seed);
        stoneFace(d, c, height, baseHeight, detail, '#62626e', seed);
      }
      ctx.save();
      ctx.transform(1, wall.slope, 1, -wall.slope, wall.x, wall.y - baseHeight - height);
      ctx.fillStyle = '#a5a3af';
      ctx.fillRect(u, v, length, depth);
      ctx.strokeStyle = '#6f6d7b';
      ctx.lineWidth = 1;
      ctx.strokeRect(u, v, length, depth);
      ctx.fillStyle = '#c4c0cd';
      ctx.fillRect(u + 1, v + 1, Math.max(0, length - 2), 2);
      if (detail) {
        ctx.fillStyle = '#888591';
        ctx.fillRect(u + length / 2, v + 2, 1, depth - 4);
      }
      ctx.restore();
    }

    function drawWallSection(section) {
      const { wall, start, end } = section;
      const length = end - start;
      const seed = Math.floor(start / 44);
      stoneBlock(wall, start - 2, -2, length + 4, wall.depth + 4, 9, 0, false, seed);
      stoneBlock(wall, start, 0, length, wall.depth, wall.height, 0, true, seed);
      const blockLength = Math.min(25, length - 8);
      if (blockLength <= 0) return;
      const merlons = [2, wall.depth - 10].map(v => ({ v, depth: wallPoint(wall, start + 4, v).y }));
      merlons.sort((a, b) => a.depth - b.depth);
      for (const merlon of merlons) {
        stoneBlock(wall, start + 4, merlon.v, blockLength, 8, 18, wall.height, false, seed);
      }
    }

    function drawPlayer() {
      const screenX = player.x - camera.x;
      const screenY = player.y - camera.y;
      ctx.fillStyle = 'rgba(14, 12, 24, 0.28)';
      ctx.beginPath();
      ctx.ellipse(screenX, screenY + 3, player.running ? 26 : 22, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      if (ready) {
        const name = player.moving ? (player.running ? 'run' : 'walk') : 'idle';
        const pose = poses[name];
        const bob = player.moving ? Math.abs(Math.sin(player.phase)) * (player.running ? 5 : 3) : 0;
        ctx.save();
        ctx.translate(screenX, screenY - bob);
        ctx.scale(player.facing * 1.15, 1.15);
        // 원본은 포즈 참고 시트이므로 보행의 상하 움직임과 흔들림을 코드로 보완합니다.
        if (player.moving) ctx.rotate(Math.sin(player.phase) * 0.025);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(sprites[name], -pose.footX, -pose.footY);
        ctx.restore();
      }
    }

    function draw() {
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.fillStyle = '#858398';
      ctx.fillRect(0, 0, view.width, view.height);
      if (floorReady) {
        ctx.save();
        ctx.translate(-camera.x, -camera.y);
        ctx.fillStyle = floorPattern;
        ctx.fillRect(camera.x, camera.y, view.width, view.height);
        ctx.restore();
      }
      const visibleSections = wallSections.filter(section => {
        const corners = wallCorners(section.wall, section.start, section.end);
        return Math.max(...corners.map(p => p.x)) + 20 > camera.x && Math.min(...corners.map(p => p.x)) - 20 < camera.x + view.width && section.depth + 30 > camera.y && Math.min(...corners.map(p => p.y)) - section.wall.height - 24 < camera.y + view.height;
      });
      ctx.save();
      ctx.translate(-camera.x, -camera.y);
      ctx.fillStyle = 'rgba(25, 21, 35, 0.24)';
      for (const wall of new Set(visibleSections.map(section => section.wall))) {
        const corners = wallCorners(wall);
        ctx.beginPath();
        corners.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x + 15, point.y + 18);
          else ctx.lineTo(point.x + 15, point.y + 18);
        });
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
      const objects = visibleSections.map(section => ({ depth: section.depth, section }));
      objects.push({ depth: player.y, section: null });
      objects.sort((a, b) => a.depth - b.depth);
      for (const object of objects) {
        if (object.section) {
          ctx.save();
          ctx.translate(-camera.x, -camera.y);
          drawWallSection(object.section);
          ctx.restore();
        } else drawPlayer();
      }

      const movementStatus = loadFailed ? '캐릭터를 불러오지 못했습니다. 페이지를 새로고침해 주세요.' : !ready ? '캐릭터 불러오는 중…' : player.moving ? (player.running ? '달리기' : '걷기') : '대기';
      const status = movementStatus + (floorFailed ? ' · background-floor.png를 같은 폴더에 놓아 주세요.' : '');
      if (status !== lastStatus) { statusLabel.textContent = status; lastStatus = status; }
    }

    function frame(time) {
      const dt = lastTime === null ? 0 : Math.min((time - lastTime) / 1000, 0.033);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    resize();
    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
